services:

  springboot-app:
    image: springboot-app
    restart: always
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "9090:8082"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      MYSQL_HOST: ${MYSQL_HOST:?set it in .env - copy .env.example}
      MYSQL_USER: ${MYSQL_USER:?set it in .env - copy .env.example}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set it in .env - copy .env.example}
      MYSQL_PORT: ${MYSQL_PORT:?set it in .env - copy .env.example}
    depends_on:
      mysqldb:
        condition: service_healthy

  react-app:
    build:
      context: ./src/main/webapp/reactjs
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      REACT_APP_API_BASE_URL: "http://localhost:9090"
    depends_on:
      springboot-app:
        condition: service_started

  mysqldb:
    container_name: mysqldb
    image: mysql:9.0
    ports:
      - "3307:3306"
    env_file:
      - .mysqlenv
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  db-data:
